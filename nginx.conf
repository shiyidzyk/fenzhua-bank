# 粉爪银行 · 卡包 —— Nginx 站点配置（自建服务器用）
# 用法：复制到 /etc/nginx/conf.d/haitecard.conf，改 root 与 server_name 后 nginx -s reload
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html application/javascript application/json;

    # index.html 612 KB，gzip 后约 162 KB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # 图片外置目录：文件名带内容 hash，可永久缓存
    location /img/ {
        types { image/webp webp; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        gzip off;
    }

    # 本地 OCR（ocr/ 目录）
    location /ocr/ {
        # 只在这个 location 里补 wasm / gz 的 MIME，不影响其他文件的默认类型
        types {
            application/wasm          wasm;
            application/javascript    js;
            application/gzip          gz;
            application/octet-stream  traineddata;
        }
        add_header Cache-Control "public, max-age=604800";
        # 语言包本身已是 .gz，不要再用 gzip_static 二次编码
        gzip_static off;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
    }
}